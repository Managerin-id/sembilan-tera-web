backend:
  name: git-gateway
  branch: main

media_folder: "assets/img"
public_folder: "assets/img"

site_url: https://sembilantera.netlify.app
display_url: https://sembilantera.netlify.app
logo_url: /assets/img/group-hero.jpg

locale: "en"

collections:
  - name: "site"
    label: "Isi Website"
    files:
      - name: "site"
        label: "Semua Konten"
        file: "content/site.json"
        fields:
          - label: "Masthead (Header Atas)"
            name: "masthead"
            widget: "object"
            fields:
              - { label: "Nama Band", name: "bandName", widget: "string" }
              - { label: "Tagline", name: "tagline", widget: "string" }
              - { label: "Label Volume/Edisi", name: "issueLabel", widget: "string" }
              - { label: "Nama Label Rekaman", name: "label", widget: "string" }

          - label: "Hero (Bagian Pembuka)"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Kicker (label kecil)", name: "kicker", widget: "string" }
              - { label: "Judul Besar", name: "headline", widget: "string" }
              - { label: "Sub-judul", name: "subhead", widget: "text" }
              - { label: "Foto Hero", name: "image", widget: "image" }
              - { label: "Keterangan Foto", name: "imageCaption", widget: "string" }

          - label: "Fakta Singkat"
            name: "facts"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Isi", name: "value", widget: "string" }

          - label: "Tentang Band"
            name: "about"
            widget: "object"
            fields:
              - { label: "Kicker", name: "kicker", widget: "string" }
              - { label: "Judul Section", name: "title", widget: "string" }
              - label: "Paragraf"
                name: "paragraphs"
                widget: "list"
                field: { label: "Paragraf", name: "paragraph", widget: "text" }
              - { label: "Kutipan (Pull Quote)", name: "pullQuote", widget: "text" }

          - label: "Personil"
            name: "members"
            widget: "object"
            fields:
              - { label: "Kicker", name: "kicker", widget: "string" }
              - { label: "Judul Section", name: "title", widget: "string" }
              - { label: "Kalimat Pembuka", name: "intro", widget: "string" }
              - label: "Daftar Personil"
                name: "list"
                widget: "list"
                fields:
                  - { label: "Nama", name: "name", widget: "string" }
                  - { label: "Peran / Alat Musik", name: "role", widget: "string" }
                  - { label: "Foto", name: "image", widget: "image" }

          - label: "Diskografi"
            name: "discography"
            widget: "object"
            fields:
              - { label: "Kicker", name: "kicker", widget: "string" }
              - { label: "Judul Section", name: "title", widget: "string" }
              - { label: "Jenis Rilisan (EP/Single/Album)", name: "releaseType", widget: "string" }
              - { label: "Judul Rilisan", name: "releaseTitle", widget: "string" }
              - { label: "Tahun Rilis", name: "releaseYear", widget: "string" }
              - { label: "Sampul Rilisan", name: "cover", widget: "image" }
              - { label: "Deskripsi", name: "description", widget: "text" }
              - { label: "Jumlah Lagu", name: "trackCount", widget: "string" }
              - { label: "Link Spotify", name: "spotifyUrl", widget: "string" }
              - { label: "Foto Grup (bawah)", name: "groupImage", widget: "image" }

          - label: "Karakter Musik"
            name: "character"
            widget: "object"
            fields:
              - { label: "Kicker", name: "kicker", widget: "string" }
              - { label: "Judul Section", name: "title", widget: "string" }
              - label: "Paragraf"
                name: "paragraphs"
                widget: "list"
                field: { label: "Paragraf", name: "paragraph", widget: "text" }

          - label: "Galeri / Dokumentasi"
            name: "gallery"
            widget: "object"
            fields:
              - { label: "Kicker", name: "kicker", widget: "string" }
              - { label: "Judul Section", name: "title", widget: "string" }
              - label: "Foto-foto"
                name: "images"
                widget: "list"
                fields:
                  - { label: "Foto", name: "image", widget: "image" }
                  - { label: "Keterangan", name: "caption", widget: "string", required: false }

          - label: "Media Sosial"
            name: "social"
            widget: "object"
            fields:
              - { label: "Kicker", name: "kicker", widget: "string" }
              - { label: "Handle / Username", name: "handle", widget: "string" }
              - label: "Platform"
                name: "platforms"
                widget: "list"
                fields:
                  - { label: "Nama Platform", name: "name", widget: "string" }
                  - { label: "Link URL", name: "url", widget: "string" }

          - label: "Kontak / Booking"
            name: "colophon"
            widget: "object"
            fields:
              - { label: "Kicker", name: "kicker", widget: "string" }
              - { label: "Nama Agensi", name: "agency", widget: "string" }
              - label: "Nomor Telepon"
                name: "phones"
                widget: "list"
                field: { label: "Nomor", name: "phone", widget: "string" }
